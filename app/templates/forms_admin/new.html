{% extends "base.html" %}
{% set sidebar_layout = true %}

{% block content %}
<div class="flat bg-gray-50 dark:bg-slate-950 min-h-screen transition-colors duration-300">
<style>
    /* Même DA stricte que l'Espace Tech : zéro arrondi, absolument partout. */
    .flat, .flat * { border-radius: 0 !important; }
    .label-tiny { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.1em; margin-bottom: 4px; display: block; }
    .input-field { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 0.75rem; outline: none; transition: all 0.2s; color: #1e293b; }
    .input-field:focus { border-color: #14b8a6; background-color: white; }
    .dark .input-field { background-color: #0f172a; border-color: #334155; color: #f1f5f9; }
    .dark .input-field:focus { border-color: #2dd4bf; background-color: #020617; }
</style>

<div class="p-6 max-w-xl mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Nouveau formulaire</h1>
        <a href="{{ url_for('forms_admin.list_forms') }}" class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-800 px-4 py-2.5 font-black text-xs uppercase shadow-sm flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Annuler
        </a>
    </div>

    <div class="bg-white dark:bg-slate-900 shadow-sm border border-gray-200 dark:border-slate-800 p-8">
        <form method="POST" class="space-y-4">
            <div>
                <label class="label-tiny">Nom du formulaire</label>
                <input type="text" name="name" class="input-field" placeholder="Ex: Demande de séjour" required>
            </div>
            <div>
                <label class="label-tiny">Identifiant (slug, optionnel)</label>
                <input type="text" name="slug" class="input-field" placeholder="Généré automatiquement si vide">
            </div>
            <div>
                <label class="label-tiny">Description (optionnel)</label>
                <textarea name="description" class="input-field" rows="3"></textarea>
            </div>
            <button type="submit" class="w-full bg-accent-600 text-white font-black py-3 hover:bg-accent-700 transition shadow-sm text-xs uppercase tracking-widest mt-2">
                Créer et configurer les champs
            </button>
        </form>
    </div>
</div>
</div>
{% endblock %}
