{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 dark:bg-slate-950 min-h-screen transition-colors duration-300 max-w-xl">

    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-black text-slate-900 dark:text-white uppercase tracking-tight">Nouveau formulaire</h1>
        <a href="{{ url_for('forms_admin.list_forms') }}" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 px-4 py-2 rounded-xl font-black text-xs uppercase shadow-sm flex items-center gap-2 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Annuler
        </a>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 p-8">
        <form method="POST" class="space-y-4">
            <div>
                <label class="label-tiny">Nom du formulaire</label>
                <input type="text" name="name" class="input-field" placeholder="Ex: Demande de séjour" required>
            </div>
            <div>
                <label class="label-tiny">Identifiant (slug, optionnel)</label>
                <input type="text" name="slug" class="input-field" placeholder="Généré automatiquement si vide">
            </div>
            <div>
                <label class="label-tiny">Description (optionnel)</label>
                <textarea name="description" class="input-field" rows="3"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl hover:bg-blue-500 transition shadow-lg text-xs uppercase tracking-widest mt-2">
                Créer et configurer les champs
            </button>
        </form>
    </div>
</div>

<style>
    .label-tiny { font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.1em; margin-bottom: 4px; display: block; }
    .input-field { width: 100%; background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 0.75rem; border-radius: 0.5rem; outline: none; transition: all 0.2s; color: #1e293b; }
    .input-field:focus { border-color: #3b82f6; background-color: white; }
    .dark .input-field { background-color: #1e293b; border-color: #334155; color: #f1f5f9; }
    .dark .input-field:focus { border-color: #60a5fa; background-color: #0f172a; }
</style>
{% endblock %}
